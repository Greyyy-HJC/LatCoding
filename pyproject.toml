[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "latcoding"
version = "0.1.0"
description = "Addon package, examples, and checks for lattice software workflows."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = []

[tool.setuptools.packages.find]
include = ["latcoding*"]
